apiVersion: v1
kind: ConfigMap
metadata:
  name: training-config
  namespace: ml-training
data:
  # Mirrors configs/training_config.yaml, with data/checkpoint paths adjusted
  # to the volume mount points used inside the cluster.
  training_config.yaml: |
    seed: 42

    model:
      name: simple_cnn
      num_classes: 10
      in_channels: 3
      conv_channels: [32, 64, 128]
      kernel_size: 3
      fc_hidden_dim: 256
      dropout: 0.3

    data:
      dataset: cifar10
      data_dir: /data
      image_size: 32
      num_workers: 2
      val_split: 0.1
      normalize:
        mean: [0.4914, 0.4822, 0.4465]
        std: [0.2470, 0.2435, 0.2616]

    training:
      batch_size: 128
      epochs: 50
      learning_rate: 0.001
      weight_decay: 0.0001
      optimizer: adam
      early_stopping:
        patience: 5
        min_delta: 0.001
      checkpoint_dir: /checkpoints
      log_every_n_steps: 50
