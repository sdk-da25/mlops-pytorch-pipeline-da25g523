apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: data-pvc
  namespace: ml-training
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 5Gi
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: checkpoints-pvc
  namespace: ml-training
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 2Gi
---
apiVersion: batch/v1
kind: Job
metadata:
  name: cifar10-training
  namespace: ml-training
spec:
  backoffLimit: 2
  template:
    spec:
      restartPolicy: Never
      containers:
        - name: train
          image: cifar10-train:latest
          # No CLI args: src/train.py reads /app/configs/training_config.yaml
          # (mounted below) and takes data_dir/checkpoint_dir from that file.
          volumeMounts:
            - name: training-config
              mountPath: /app/configs
            - name: data
              mountPath: /app/data
            - name: checkpoints
              mountPath: /app/checkpoints
          resources:
            requests:
              cpu: "1"
              memory: "2Gi"
            limits:
              cpu: "2"
              memory: "4Gi"
      volumes:
        - name: training-config
          configMap:
            name: training-config
            items:
              - key: training_config.yaml
                path: training_config.yaml
        - name: data
          persistentVolumeClaim:
            claimName: data-pvc
        - name: checkpoints
          persistentVolumeClaim:
            claimName: checkpoints-pvc
